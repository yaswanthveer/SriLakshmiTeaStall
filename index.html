<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>శ్రీ లక్ష్మీ టీ స్టాల్ - Music Player</title>
    <!-- Use Google Fonts for beautiful typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #F5E6D3;
            --accent-color: #ffffff;
            --text-light: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(60, 20, 10, 0.4); /* Deep warm dark glass */
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-light);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Background Image Container */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('./tea stall.png');
            background-size: cover;
            background-position: center;
            /* Filter to match the warm, slightly softened vibe */
            filter: brightness(0.8) contrast(1.1);
            z-index: -1;
        }

        /* Top Navigation Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            position: absolute;
            top: 0;
            z-index: 10;
        }

        .time-display {
            opacity: 0.9;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }


        .links {
            display: flex;
            gap: 20px;
        }

        .links a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.8;
            transition: opacity 0.3s, transform 0.2s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .links a:hover {
            opacity: 1;
            transform: translateY(-1px);
        }

        .links svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .footer-credit {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        .footer-credit a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer-credit a:hover {
            color: white;
            text-decoration: underline;
        }

        /* Center Typography */
        .center-typography {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-family: 'Playfair Display', serif;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.4);
            z-index: 5;
            width: 100%;
        }

        .center-typography h1 {
            font-size: clamp(2rem, 10vw, 8rem);
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .center-typography h1 span {
            display: block;
        }

        /* Player Pill */
        .player-pill {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 12px 24px 12px 12px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            z-index: 10;
        }

        .album-art {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
        }

        .player-pill:hover .album-art {
            transform: scale(1.05);
        }

        .track-info {
            margin-left: 16px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .track-title {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .track-artist {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            width: 100%;
        }

        .time-text {
            font-size: 10px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            min-width: 65px;
            text-align: right;
        }

        /* Custom Range Slider for Progress */
        .progress-bar {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            position: relative;
        }

        /* The filled track effect */
        .progress-bar::before {
            content: '';
            position: absolute;
            height: 100%;
            width: var(--progress, 0%);
            background-color: var(--accent-color);
            border-radius: 2px;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-container:hover .progress-bar::-webkit-slider-thumb {
            opacity: 1;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: 16px;
        }

        .control-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 50%;
            transition: transform 0.2s, background-color 0.2s;
            opacity: 0.8;
        }

        .control-btn:hover {
            opacity: 1;
            background-color: rgba(255,255,255,0.1);
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .control-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .play-btn {
            background-color: white;
            color: black;
            opacity: 1;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .play-btn:hover {
            background-color: #f0f0f0;
            opacity: 1;
            transform: scale(1.05);
        }

        .play-btn svg {
            width: 20px;
            height: 20px;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
            position: relative;
        }

        .volume-slider {
            width: 50px;
            -webkit-appearance: none;
            height: 3px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            outline: none;
            transition: width 0.3s;
            cursor: pointer;
        }

        .volume-slider::before {
            content: '';
            position: absolute;
            height: 3px;
            width: var(--volume, 70%);
            background-color: var(--accent-color);
            border-radius: 2px;
            top: 50%;
            transform: translateY(-50%);
            left: 28px; /* Offset past icon */
            pointer-events: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            opacity: 0;
        }

        .volume-container:hover .volume-slider::-webkit-slider-thumb {
            opacity: 1;
        }


        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .top-bar { padding: 15px 20px; font-size: 12px; }
            .player-pill { width: 95%; padding: 10px 16px 10px 10px; bottom: 35px;}
            .album-art { width: 50px; height: 50px; }
            .track-info { margin-left: 12px; }
            .controls { gap: 8px; margin-left: 8px; }
            .volume-container { display: none; /* Hide volume on small screens */ }
            .time-text { min-width: 55px; font-size: 9px; }
            .footer-credit { bottom: 10px; right: 50%; transform: translateX(50%); font-size: 10px; white-space: nowrap; }
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <header class="top-bar">
        <div class="time-display" id="clock">7:06 pm</div>

        <div class="links">
            <a href="https://open.spotify.com/album/5JgXNLvNYS1BQkVcZJIKVt?si=mo3qC_t9QfmPb16n5_-q1w" target="_blank" id="spotify-link">
                <!-- Spotify Icon -->
                <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>

                <!-- YouTube Music Icon roughly -->
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
                YT Music ↗

    </header>

    <div class="center-typography">
        <h1><span>శ్రీ లక్ష్మీ</span> <span>టీ స్టాల్</span></h1>
    </div>

    <div class="player-pill">
        <img src="https://placehold.co/200x200/4A3728/FFFFFF?text=Cover" alt="Album Art" class="album-art" id="album-art">
        
        <div class="track-info">
            <div class="track-title" id="track-title">Loading...</div>
            <div class="track-artist" id="track-artist">Loading...</div>
            
            <div class="progress-container">
                <input type="range" class="progress-bar" id="progress-bar" value="0" min="0" max="100" step="0.1">
                <div class="time-text">
                    <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <!-- Optional Secondary Controls mapped visually on the left side of main controls -->
            <div class="volume-container">
                <button class="control-btn" id="mute-btn" title="Mute/Unmute">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
                <input type="range" class="volume-slider" id="volume-slider" value="70" min="0" max="100">
            </div>

            <button class="control-btn" id="prev-btn" title="Previous">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            
            <button class="control-btn play-btn" id="play-btn" title="Play/Pause">
                <!-- Play Icon -->
                <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <!-- Pause Icon (hidden initially) -->
                <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            
            <button class="control-btn" id="next-btn" title="Next">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audio-player"></audio>

    <script>
        // PLAYLIST CONFIGURATION
        // Replace these with your actual songs when ready
        const playlist = [
            {
                title: "Chiluka Kshemama",
                artist: "Rowdy Alludu",
                audioUrl: "./tea stall songs/01 - chiluka-kshemama-from-rowdy-alludu.mp3",

            },
            {

                audioUrl: "./tea stall songs/02 - chethilona-cheyyesi-from-bombai-priyudu.mp3",
                imageUrl: "./tea stall.png",
                spotifyUrl: "https://open.spotify.com",

            },
            {
                title: "Entha Ghatu Premayo",

                audioUrl: "./tea stall songs/03 - entha-ghatu-premayo-from-muta-mestri.mp3",
                imageUrl: "./tea stall.png",

                youtubeUrl: "https://music.youtube.com"
            },
            {
                title: "Manasu Aagadhu",
                artist: "Bangaru Bullodu",
                audioUrl: "./tea stall songs/04 - manasu-aagadhu-from-bangaru-bullodu.mp3",
                imageUrl: "./tea stall.png",
                spotifyUrl: "https://open.spotify.com",
                youtubeUrl: "https://music.youtube.com"
            },
            {
                title: "Swathilo Muthyamantha",
                artist: "Bangaru Bullodu",
                audioUrl: "./tea stall songs/05 - swathilo-muthyamantha-from-bangaru-bullodu.mp3",
                imageUrl: "./tea stall.png",
                spotifyUrl: "https://open.spotify.com",
                youtubeUrl: "https://music.youtube.com"
            },
            {
                title: "Na Cheli Rojave",
                artist: "Roja",
                audioUrl: "./tea stall songs/06 - na-cheli-rojave-from-roja.mp3",
                imageUrl: "./tea stall.png",
                spotifyUrl: "https://open.spotify.com",
                youtubeUrl: "https://music.youtube.com"
            },
            {
                title: "Abbanee",
                artist: "Telugu Hit",
                audioUrl: "./tea stall songs/Abbanee (PenduJatt.Com.Se).mp3",
                imageUrl: "./tea stall.png"
            },
            {
                title: "Balapam Patti",
                artist: "Telugu Hit",
                audioUrl: "./tea stall songs/Balapam Patti (PenduJatt.Com.Se).mp3",
                imageUrl: "./tea stall.png"
            },
            {
                title: "Hallo Guru",
                artist: "Telugu Hit",
                audioUrl: "./tea stall songs/Hallo Guru (PenduJatt.Com.Se).mp3",
                imageUrl: "./tea stall.png"
            },
            {
                title: "Jabilli Kosam (Male)",
                artist: "Telugu Hit",
                audioUrl: "./tea stall songs/Jabilli Kosam [Male] (PenduJatt.Com.Se).mp3",
                imageUrl: "./tea stall.png"
            },
            {
                title: "Kammani",
                artist: "Telugu Hit",
                audioUrl: "./tea stall songs/Kammani (PenduJatt.Com.Se).mp3",
                imageUrl: "./tea stall.png"
            },
            {
                title: "Mate Rani",
                artist: "Telugu Hit",
                audioUrl: "./tea stall songs/Mate Rani (PenduJatt.Com.Se).mp3",
                imageUrl: "./tea stall.png"
            },
            {
                title: "Singarala",
                artist: "Telugu Hit",
                audioUrl: "./tea stall songs/Singarala (PenduJatt.Com.Se).mp3",
                imageUrl: "./tea stall.png"
            },
            {
                title: "Star Star",
                artist: "Telugu Hit",
                audioUrl: "./tea stall songs/Star Star (PenduJatt.Com.Se).mp3",
                imageUrl: "./tea stall.png"
            },
            {
                title: "Subhalekha",
                artist: "Telugu Hit",
                audioUrl: "./tea stall songs/Subhalekha (PenduJatt.Com.Se).mp3",
                imageUrl: "./tea stall.png"
            },
            {
                title: "Vayyari Godaramma",
                artist: "Telugu Hit",
                audioUrl: "./tea stall songs/Vayyari Godaramma (PenduJatt.Com.Se).mp3",
                imageUrl: "./tea stall.png"
            }
        ];

        // DOM Elements
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        
        const progressBar = document.getElementById('progress-bar');
        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');
        
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const albumArt = document.getElementById('album-art');
        
        const spotifyLink = document.getElementById('spotify-link');
        const ytLink = document.getElementById('yt-link');
        
        // State
        let currentSongIndex = parseInt(localStorage.getItem('savedIndex')) || 0;
        let isPlaying = false;
        
        // Ensure index is valid
        if(currentSongIndex >= playlist.length || currentSongIndex < 0) {
            currentSongIndex = 0;
        }

        // Initialize Player
        function loadSong(index) {
            const song = playlist[index];
            audio.src = song.audioUrl;
            trackTitle.textContent = song.title;
            trackArtist.textContent = song.artist;
            albumArt.src = song.imageUrl;
            
            
            // Save state
            localStorage.setItem('savedIndex', index);
            
            // Reset progress visually
            progressBar.value = 0;
            updateProgressVar(0);
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function updatePlayPauseUI() {
            if (audio.paused) {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                isPlaying = false;
            } else {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                isPlaying = true;
            }
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) audio.play();
        }

        function prevSong() {
            // If playing for more than 3 seconds, restart current song instead
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
            } else {
                currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
                loadSong(currentSongIndex);
                if (isPlaying) audio.play();
            }
        }

        // Format time in seconds to M:SS
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Update CSS variable for the filled part of range inputs
        function updateProgressVar(percent) {
            progressBar.style.setProperty('--progress', `${percent}%`);
        }
        
        function updateVolumeVar(percent) {
            volumeSlider.style.setProperty('--volume', `${percent}%`);
        }

        // Event Listeners - Audio
        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            // Update time text
            currentTimeEl.textContent = formatTime(audio.currentTime);
            
            // Update progress bar if not currently dragging it
            if (!progressBar.dataset.dragging) {
                const percent = (audio.currentTime / audio.duration) * 100 || 0;
                progressBar.value = percent;
                updateProgressVar(percent);
            }
        });

        audio.addEventListener('play', updatePlayPauseUI);
        audio.addEventListener('pause', updatePlayPauseUI);
        audio.addEventListener('ended', nextSong); // Auto-advance

        // Event Listeners - Controls
        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextSong);
        prevBtn.addEventListener('click', prevSong);

        // Progress Bar Interaction
        progressBar.addEventListener('input', (e) => {
            progressBar.dataset.dragging = true;
            updateProgressVar(e.target.value);
            // Calculate provisional time while dragging
            const time = (e.target.value / 100) * (audio.duration || 0);
            currentTimeEl.textContent = formatTime(time);
        });

        progressBar.addEventListener('change', (e) => {
            delete progressBar.dataset.dragging;
            const time = (e.target.value / 100) * (audio.duration || 0);
            audio.currentTime = time;
        });

        // Volume Interaction
        volumeSlider.addEventListener('input', (e) => {
            const vol = e.target.value / 100;
            audio.volume = vol;
            updateVolumeVar(e.target.value);
            localStorage.setItem('savedVolume', e.target.value);
            
            if (vol > 0) audio.muted = false;
        });

        muteBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            if (audio.muted) {
                updateVolumeVar(0);
                volumeSlider.value = 0;
            } else {
                const vol = localStorage.getItem('savedVolume') || 70;
                updateVolumeVar(vol);
                volumeSlider.value = vol;
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            // Prevent scrolling on space
            if(e.code === 'Space' && e.target === document.body) {
                e.preventDefault();
                togglePlay();
            } else if(e.code === 'ArrowRight') {
                nextSong();
            } else if(e.code === 'ArrowLeft') {
                prevSong();
            }
        });

        // Initialize Live Clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            document.getElementById('clock').textContent = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();


        // Initialization Run
        loadSong(currentSongIndex);
        
        // Restore Volume
        const savedVol = localStorage.getItem('savedVolume') || 70;
        audio.volume = savedVol / 100;
        volumeSlider.value = savedVol;
        updateVolumeVar(savedVol);

        // Attempt Autoplay
        audio.play().then(() => {
            updatePlayPauseUI();
        }).catch((e) => {
            console.log("Autoplay prevented by browser. User interaction required first.");
        });

    </script>
